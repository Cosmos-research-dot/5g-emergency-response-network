version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: 5g-ern-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: 5g_ern_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - 5g-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  5g-ern:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: 5g-ern-server
    ports:
      - "3000:3000"
    environment:
      # Server Configuration
      NODE_ENV: development
      PORT: 3000
      HOST: 0.0.0.0
      
      # Database Configuration
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: 5g_ern_dev
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_SSL: "false"
      
      # Authentication & Security
      JWT_SECRET: ${JWT_SECRET:-change-this-secret-key-in-production}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change-this-refresh-secret-key-in-production}
      ENCRYPTION_MASTER_KEY: ${ENCRYPTION_MASTER_KEY:-change-this-encryption-key-in-production}
      
      # CORS
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173
      
      # Rate Limiting
      RATE_LIMIT_WINDOW_MS: "900000"
      RATE_LIMIT_MAX_REQUESTS: "100"
      
      # Security
      HTTPS_ENABLED: "false"
      SECURITY_HEADERS_ENABLED: "true"
      
      # Audit Logging
      AUDIT_LOGGING_ENABLED: "true"
      HIPAA_MODE: "true"
      
      # Features
      FEATURE_TWO_FACTOR_AUTH: "true"
      FEATURE_API_KEYS: "true"
      USE_DEMO_DATA: "true"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - 5g-network
    restart: unless-stopped
    volumes:
      - ./logs:/app/logs
      - ./src:/app/src
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 40s

networks:
  5g-network:
    driver: bridge

volumes:
  postgres_data:
