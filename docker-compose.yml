version: '3.8'

services:
  5g-ern:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: 5g-ern-server
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
    networks:
      - 5g-network
    restart: unless-stopped
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 40s

networks:
  5g-network:
    driver: bridge
